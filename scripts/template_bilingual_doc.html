<!DOCTYPE html>
<html lang="$lang$">
<head>
    <meta charset="UTF-8">
    <title>$title$</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: $body_font$;
            line-height: 1.7;
            color: #2c3e50;
            background-color: #ffffff;
            font-size: 1rem;
        }

        /* 标题样式 */
        h1, h2, h3, h4, h5, h6 {
            font-weight: 600;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            color: #1a202c;
            line-height: 1.3;
        }

        h1 {
            font-size: 2rem;
            border-bottom: 3px solid #3182ce;
            padding-bottom: 0.75rem;
            margin-top: 0;
            margin-bottom: 2rem;
        }

        h2 {
            font-size: 1.7rem;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 0.5rem;
            margin-top: 3rem;
        }

        h3 {
            font-size: 1.4rem;
            color: #2d3748;
        }

        /* 原文段落（双语对照：灰色、略小，紧跟其后的是译文） */
        div.orig {
            color: #64748b;
            font-size: 0.92em;
            margin: 0 0 0.35rem 0;
        }

        div.orig p {
            margin-bottom: 0.4rem;
            text-indent: 2em;
            color: #64748b;
            font-family: $body_font$;
        }

        div.orig blockquote {
            border-left: 3px solid #cbd5e0;
            background: #f8fafc;
        }

        div.orig strong, div.orig b {
            color: #64748b;
        }

        /* 段落样式（译文） */
        p {
            margin-bottom: 1.25rem;
            text-align: justify;
            word-break: break-word;
            text-indent: 2em;
            font-family: $body_font$;
        }

        /* 链接样式 */
        a {
            color: #3182ce;
            text-decoration: none;
        }

        /* 图片样式 - 居中显示 */
        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 2rem auto;
        }

        /* 列表样式 */
        ul, ol {
            margin: 1.25rem 0;
            padding-left: 2rem;
        }

        li {
            margin-bottom: 0.5rem;
        }

        /* 代码样式 */
        code {
            font-family: 'Courier New', 'Monaco', 'Consolas', 'Ubuntu Mono', monospace;
            background-color: #f7fafc;
            padding: 0.125rem 0.375rem;
            border-radius: 3px;
            font-size: 0.875rem;
        }

        pre {
            background-color: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 1.25rem;
            margin: 1.5rem 0;
            overflow-x: auto;
            font-family: 'Courier New', 'Monaco', 'Consolas', 'Ubuntu Mono', monospace;
            font-size: 0.875rem;
            line-height: 1.5;
        }

        pre code {
            background: none;
            padding: 0;
            border-radius: 0;
            font-size: inherit;
        }

        div.orig pre {
            background-color: #fbfcfd;
            color: #64748b;
        }

        /* 引用样式 */
        blockquote {
            border-left: 4px solid #a0aec0;
            margin: 1.5rem 0;
            padding: 1rem 1.5rem;
            background-color: #f7fafc;
            color: #4a5568;
            border-radius: 0 6px 6px 0;
            font-family: $body_font$;
        }

        blockquote p:last-child {
            margin-bottom: 0;
        }

        /* 表格样式 */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            background-color: #ffffff;
        }

        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background-color: #f7fafc;
            font-weight: 600;
            color: #2d3748;
        }

        /* 分隔线 */
        hr {
            border: none;
            border-top: 2px solid #e2e8f0;
            margin: 3rem 0;
        }

        /* 页面分隔器 */
        .page-separator {
            border-top: 2px solid #e2e8f0;
            margin: 3rem 0;
            text-align: center;
            position: relative;
        }

        .page-separator::after {
            content: "• • •";
            background-color: #ffffff;
            color: #a0aec0;
            padding: 0 1rem;
            position: relative;
            top: -0.75rem;
        }

        /* 强调样式 */
        strong, b {
            font-weight: 700;
            color: #1a202c;
        }

        em, i {
            font-style: italic;
            color: #4a5568;
        }

        /* 打印/分页友好 */
        h1, h2, h3, h4, h5, h6 {
            page-break-after: avoid;
        }

        img, table, pre, blockquote {
            page-break-inside: avoid;
        }

        @page {
            size: A4;
            margin: 2cm 1.8cm;
        }

        mjx-container[jax="CHTML"][display="true"] {
            margin: 1rem 0 !important;
        }
    </style>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            },
            chtml: { scale: 0.96 }
        };
    </script>
    <script src="$mathjax_src$" async></script>
</head>
<body>
    $body$
</body>
</html>
